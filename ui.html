<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BIN Checker Pro — Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root[data-theme="purple"]{--bg-1:#667eea;--bg-2:#764ba2;--bg-3:#f093fb;--primary:#667eea;--primary-2:#764ba2;--accent:#f093fb}
  :root[data-theme="blue"]{--bg-1:#1e3a8a;--bg-2:#0ea5e9;--bg-3:#06b6d4;--primary:#0ea5e9;--primary-2:#0284c7;--accent:#06b6d4}
  :root[data-theme="green"]{--bg-1:#065f46;--bg-2:#10b981;--bg-3:#34d399;--primary:#10b981;--primary-2:#059669;--accent:#34d399}
  :root[data-theme="red"]{--bg-1:#7f1d1d;--bg-2:#ef4444;--bg-3:#f97316;--primary:#ef4444;--primary-2:#dc2626;--accent:#f97316}
  :root[data-theme="dark"]{--bg-1:#0f0c29;--bg-2:#302b63;--bg-3:#24243e;--primary:#818cf8;--primary-2:#a78bfa;--accent:#f472b6}
  :root{--card-bg:rgba(20,20,40,.85);--glass-bg:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.18);--border:rgba(255,255,255,.15);--error:#f87171;--success:#34d399;--warning:#fbbf24;--shadow-lg:0 25px 50px -12px rgba(0,0,0,.5)}
  body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(-45deg,var(--bg-1),var(--bg-2),var(--bg-3),var(--bg-1));background-size:400% 400%;animation:g 15s ease infinite;color:#fff;padding:30px 20px;min-height:100vh;position:relative;overflow-x:hidden}
  @keyframes g{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  #particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5}
  .container{max-width:1150px;margin:0 auto;background:var(--card-bg);backdrop-filter:blur(25px);padding:35px;border-radius:28px;border:1px solid var(--glass-border);box-shadow:var(--shadow-lg);position:relative;z-index:1}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
  .logo{display:flex;align-items:center;justify-content:center;gap:12px;flex:1}
  .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 25px rgba(129,140,248,.5);animation:lp 3s ease-in-out infinite}
  @keyframes lp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  h1{font-size:26px;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
  .theme-selector{display:flex;gap:6px;padding:6px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px}
  .theme-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .3s}
  .theme-dot:hover{transform:scale(1.2)}
  .theme-dot.active{border-color:#fff;transform:scale(1.15)}
  .theme-dot[data-t="purple"]{background:linear-gradient(135deg,#667eea,#764ba2)}
  .theme-dot[data-t="blue"]{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
  .theme-dot[data-t="green"]{background:linear-gradient(135deg,#10b981,#34d399)}
  .theme-dot[data-t="red"]{background:linear-gradient(135deg,#ef4444,#f97316)}
  .theme-dot[data-t="dark"]{background:linear-gradient(135deg,#0f0c29,#302b63)}
  .subtitle{text-align:center;color:#e2e8f0;font-size:14px;margin-bottom:25px;font-weight:500}
  .offline-badge{display:inline-block;padding:4px 12px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);border-radius:20px;font-size:11px;font-weight:700;color:#34d399;margin-left:8px}
  textarea{width:100%;padding:16px 18px;font-size:14px;border:2px solid var(--border);border-radius:16px;outline:none;background:rgba(0,0,0,.3);color:#fff;resize:vertical;min-height:130px;font-family:'SF Mono','Courier New',monospace;transition:all .3s}
  textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(129,140,248,.2)}
  textarea::placeholder{color:#94a3b8}
  .hint{font-size:12px;color:#cbd5e1;margin-top:8px;margin-bottom:15px;padding-left:4px}
  .info-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:14px 18px;background:var(--glass-bg);border-radius:16px;border:1px solid var(--glass-border);font-size:13px;flex-wrap:wrap}
  .info-bar .label{color:#e2e8f0;font-weight:700}
  .info-bar .value{color:#a5b4fc;font-size:12px;font-weight:700;padding:4px 10px;background:rgba(129,140,248,.2);border-radius:20px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .btn{flex:1;min-width:110px;padding:14px 18px;border:none;border-radius:14px;font-size:14px;cursor:pointer;font-weight:700;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 8px 20px rgba(129,140,248,.5)}
  .btn-primary:hover:not(:disabled){transform:translateY(-3px) scale(1.02)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-secondary{background:var(--glass-bg);color:#fff;border:1px solid var(--glass-border)}
  .btn-secondary:hover{background:rgba(129,140,248,.3);transform:translateY(-3px)}
  .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.4)}
  .btn-danger:hover{transform:translateY(-3px) scale(1.02)}
  .progress-wrap{display:none;margin:20px 0}
  .progress-info{display:flex;justify-content:space-between;font-size:13px;color:#e2e8f0;margin-bottom:10px;font-weight:600}
  .progress-bar{height:14px;background:rgba(0,0,0,.3);border-radius:20px;overflow:hidden;border:1px solid var(--glass-border)}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary));background-size:200% 100%;animation:sh 2s linear infinite;width:0;transition:width .3s;border-radius:20px}
  @keyframes sh{0%{background-position:0% 0}100%{background-position:200% 0}}
  .current-check{display:none;text-align:center;margin:12px 0;padding:10px;background:rgba(129,140,248,.15);border-radius:12px;font-size:13px;color:#a5b4fc;font-weight:600}
  .current-check .bin-code{font-family:'Courier New',monospace;color:#fff;font-weight:700;padding:2px 8px;background:rgba(0,0,0,.3);border-radius:6px;margin-left:6px}
  .stats{display:none;gap:12px;flex-wrap:wrap;margin:22px 0}
  .stat-box{flex:1;min-width:100px;background:rgba(0,0,0,.25);padding:18px 12px;border-radius:18px;text-align:center;border:1px solid var(--glass-border);border-left:4px solid var(--primary);transition:all .3s}
  .stat-box:hover{transform:translateY(-6px) scale(1.03)}
  .stat-box.success{border-left-color:var(--success)}
  .stat-box.error{border-left-color:var(--error)}
  .stat-num{font-size:24px;font-weight:800;color:#fff}
  .stat-box.success .stat-num{color:#34d399}
  .stat-box.error .stat-num{color:#f87171}
  .stat-label{font-size:11px;color:#cbd5e1;margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .result-section{margin-top:25px;display:none}
  .result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
  .result-header h2{font-size:17px;font-weight:700}
  .export-btns{display:flex;gap:8px;flex-wrap:wrap}
  .export-btn{background:var(--glass-bg);border:1px solid var(--glass-border);color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;font-weight:600;transition:all .3s}
  .export-btn:hover{background:linear-gradient(135deg,var(--primary),var(--primary-2));transform:translateY(-2px)}
  .result-table-wrap{max-height:620px;overflow:auto;border:1px solid var(--glass-border);border-radius:18px;background:rgba(0,0,0,.25)}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  thead{position:sticky;top:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;z-index:1}
  th,td{padding:14px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);word-wrap:break-word;color:#fff}
  th{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
  td.col-bin{white-space:nowrap;font-weight:700;font-family:'SF Mono','Courier New',monospace;color:#a5b4fc}
  tbody tr{transition:all .2s;animation:fr .3s ease}
  tbody tr:hover{background:rgba(129,140,248,.1)}
  .error-row td{color:#f87171;font-weight:500}
  .source-tag{font-size:9px;margin-left:6px;padding:2px 6px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .source-tag.db{color:#34d399;background:rgba(52,211,153,.2)}
  @keyframes fr{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  th:nth-child(1),td:nth-child(1){width:45px;text-align:center}
  th:nth-child(2),td:nth-child(2){width:130px}
  th:nth-child(3),td:nth-child(3){width:95px}
  th:nth-child(4),td:nth-child(4){width:80px}
  th:nth-child(5),td:nth-child(5){width:90px}
  th:nth-child(6),td:nth-child(6){width:auto}
  th:nth-child(7),td:nth-child(7){width:130px}
  .confetti{position:fixed;width:10px;height:10px;z-index:9999;pointer-events:none;animation:cf linear forwards}
  @keyframes cf{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:10px}
  @media(max-width:640px){body{padding:15px 10px}.container{padding:20px 16px;border-radius:22px}h1{font-size:18px}.logo-icon{width:42px;height:42px;font-size:22px}.btn{font-size:13px;padding:12px;min-width:90px}table{font-size:11px}th,td{padding:10px 6px}th:nth-child(1),td:nth-child(1){display:none}.stat-num{font-size:18px}.theme-selector{display:none}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="container">
  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>BIN Checker Pro <span class="offline-badge">🔌 OFFLINE</span></h1>
    </div>
    <div class="theme-selector">
      <div class="theme-dot active" data-t="purple" onclick="setTheme('purple')"></div>
      <div class="theme-dot" data-t="blue" onclick="setTheme('blue')"></div>
      <div class="theme-dot" data-t="green" onclick="setTheme('green')"></div>
      <div class="theme-dot" data-t="red" onclick="setTheme('red')"></div>
      <div class="theme-dot" data-t="dark" onclick="setTheme('dark')"></div>
    </div>
  </div>

  <p class="subtitle">✨ SmartBinDB • No Internet • No API Key • 100% Free</p>

  <textarea id="binInput" placeholder="Paste BINs here, one per line...&#10;440393&#10;515597&#10;497040"></textarea>
  <p class="hint">💡 One per line. Full card auto-extracts first 6 digits.</p>

  <div class="info-bar">
    <span class="label">⚡ Mode:</span>
    <span class="value">Offline Database</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="checkBtn" onclick="startCheck()">🚀 Check All</button>
    <button class="btn btn-danger" id="stopBtn" onclick="stopCheck()" style="display:none;">⏹ Stop</button>
    <button class="btn btn-secondary" onclick="clearAll()">✖️ Clear</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info">
      <span id="progressText">Processing...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="current-check" id="currentCheck">
    🔍 Checking: <span class="bin-code" id="currentBin">—</span>
  </div>

  <div class="stats" id="stats">
    <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat-box success"><div class="stat-num" id="statSuccess">0</div><div class="stat-label">Found</div></div>
    <div class="stat-box error"><div class="stat-num" id="statError">0</div><div class="stat-label">Not Found</div></div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <h2>📊 Results</h2>
      <div class="export-btns">
        <button class="export-btn" onclick="exportCSV()">⬇️ CSV</button>
        <button class="export-btn" onclick="exportJSON()">⬇️ JSON</button>
        <button class="export-btn" onclick="copyResults()">📋 Copy</button>
      </div>
    </div>
    <div class="result-table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>BIN</th><th>BRAND</th><th>TYPE</th><th>LEVEL</th><th>BANK</th><th>COUNTRY</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.t===t));
}
setTheme('purple');

const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
function createParticles(){
  particles=[];
  const c=Math.min(40,Math.floor(window.innerWidth/35));
  for(let i=0;i<c;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.5,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,alpha:Math.random()*.5+.2});
}
createParticles();
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>canvas.width)p.vx*=-1;
    if(p.y<0||p.y>canvas.height)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.globalAlpha=p.alpha;ctx.fill();
  });
  ctx.globalAlpha=1;requestAnimationFrame(animate);
}
animate();

function fireConfetti(){
  const colors=['#667eea','#f093fb','#10b981','#f59e0b','#ef4444','#06b6d4'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(Math.random()*2+2)+'s';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

let statsData={total:0,success:0,error:0};
let allResults=[];
let isStopped=false;

function resetStats(){
  statsData={total:0,success:0,error:0};
  allResults=[];
  document.getElementById('resultBody').innerHTML='';
}
function updateStats(){
  document.getElementById('statTotal').textContent=statsData.total;
  document.getElementById('statSuccess').textContent=statsData.success;
  document.getElementById('statError').textContent=statsData.error;
  document.getElementById('stats').style.display='flex';
}
function updateProgress(done,total){
  const p=Math.round(done/total*100);
  document.getElementById('progressText').textContent=`Checked ${done} of ${total}`;
  document.getElementById('progressPercent').textContent=p+'%';
  document.getElementById('progressFill').style.width=p+'%';
}
function escapeHtml(s){
  if(s==null)return'';
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function extractBIN(input){
  const d=input.replace(/\D/g,'');
  if(d.length>=6&&d.length<=8)return d;
  if(d.length>8)return d.substring(0,6);
  return null;
}

function addResultRow(index,bin,data,error){
  const tbody=document.getElementById('resultBody');
  const tr=document.createElement('tr');
  if(error){
    tr.className='error-row';
    tr.innerHTML=`<td>${index+1}</td><td class="col-bin">${escapeHtml(bin)}</td><td colspan="5">❌ ${escapeHtml(error)}</td>`;
    allResults.push({index:index+1,bin,error});
  }else{
    tr.innerHTML=`
      <td>${index+1}</td>
      <td class="col-bin">${escapeHtml(bin)}<span class="source-tag db">DB</span></td>
      <td>${escapeHtml(data.scheme||'N/A')}</td>
      <td>${escapeHtml(data.type||'N/A')}</td>
      <td>${escapeHtml(data.level||'N/A')}</td>
      <td>${escapeHtml(data.bank||'N/A')}</td>
      <td>${escapeHtml(data.country||'N/A')} ${data.flag||''}</td>
    `;
    allResults.push({index:index+1,bin,brand:data.scheme,type:data.type,level:data.level,bank:data.bank,country:data.country});
  }
  tbody.appendChild(tr);
}

function stopCheck(){isStopped=true}
function clearAll(){
  document.getElementById('binInput').value='';
  document.getElementById('resultSection').style.display='none';
  document.getElementById('progressWrap').style.display='none';
  document.getElementById('stats').style.display='none';
  document.getElementById('currentCheck').style.display='none';
  document.getElementById('resultBody').innerHTML='';
}

async function startCheck(){
  const input=document.getElementById('binInput').value.trim();
  const checkBtn=document.getElementById('checkBtn');
  const stopBtn=document.getElementById('stopBtn');
  const currentCheck=document.getElementById('currentCheck');

  if(!input){alert("Please enter BINs.");return}

  const lines=input.split(/\n/).map(l=>l.trim()).filter(l=>l);
  const bins=[];const seen=new Set();
  for(const line of lines){
    const b=extractBIN(line);
    if(b&&!seen.has(b)){seen.add(b);bins.push(b)}
  }
  if(bins.length===0){alert("No valid BIN.");return}

  const limited=bins.slice(0,5000);
  isStopped=false;

  checkBtn.disabled=true;checkBtn.textContent="⏳ Checking...";
  stopBtn.style.display='block';
  resetStats();
  statsData.total=limited.length;
  updateStats();
  document.getElementById('resultSection').style.display='block';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('stats').style.display='flex';
  currentCheck.style.display='block';

  const startTime=Date.now();
  updateProgress(0,limited.length);

  for(let i=0;i<limited.length;i++){
    if(isStopped)break;
    const bin=limited[i];
    document.getElementById('currentBin').textContent=bin;

    try{
      const data=await window.pywebview.api.lookup(bin);
      if(data && data.error){
        statsData.error++;
        addResultRow(i,bin,null,data.error);
      }else{
        statsData.success++;
        addResultRow(i,bin,data,null);
      }
    }catch(e){
      statsData.error++;
      addResultRow(i,bin,null,"Lookup failed");
    }
    updateStats();
    updateProgress(i+1,limited.length);
  }

  const elapsed=((Date.now()-startTime)/1000).toFixed(1);
  checkBtn.disabled=false;checkBtn.textContent="🚀 Check All";
  stopBtn.style.display='none';
  currentCheck.style.display='none';
  document.getElementById('progressText').textContent=`✅ Done in ${elapsed}s${isStopped?' (stopped)':''}`;

  if(!isStopped && statsData.error===0 && statsData.success>0)fireConfetti();
}

function exportCSV(){
  if(allResults.length===0)return alert("No results.");
  const headers=['#','BIN','Brand','Type','Level','Bank','Country'];
  const rows=allResults.map(r=>r.error?[r.index,r.bin,'ERROR',r.error,'','','']:[r.index,r.bin,r.brand,r.type,r.level,r.bank,r.country]);
  const csv=[headers,...rows].map(row=>row.map(c=>`"${c}"`).join(',')).join('\n');
  download(csv,'bin-results.csv','text/csv');
}
function exportJSON(){
  if(allResults.length===0)return alert("No results.");
  download(JSON.stringify(allResults,null,2),'bin-results.json','application/json');
}
function copyResults(){
  if(allResults.length===0)return alert("No results.");
  const text=allResults.map(r=>r.error?`${r.bin} -> ERROR`:`${r.bin} -> ${r.brand} | ${r.type} | ${r.level} | ${r.bank} | ${r.country}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert("Copied!"));
}
function download(content,filename,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
