name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "BINCheckerPro" --add-data "ui.html;." --hidden-import=clr --hidden-import=clr_loader app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BINCheckerPro-Windows
          path: dist/BINCheckerPro.exe
